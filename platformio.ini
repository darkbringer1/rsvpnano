[platformio]
default_envs = waveshare_esp32s3_usb_msc

[env]
platform = espressif32@6.3.2
board = esp32-s3-r8-opi
framework = arduino
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/pio_set_version.py
; SH8601 driver only compiles in the AMOLED env; exclude it everywhere else.
build_src_filter = +<*> -<display/sh8601.cpp>
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DRSVP_ON_DEVICE_EPUB_CONVERSION=1

; Waveshare ESP32-S3-Touch-AMOLED-1.8 (SH8601 368x448, FT3168 touch). Port target.
[env:amoled]
build_src_filter = +<*> -<display/axs15231b.cpp>
; USB transfer (SD-over-USB mass storage) needs the TinyUSB stack
; (ARDUINO_USB_MODE=0). The board JSON forces USB_MODE=1, so unflag it first.
; CDC-on-boot stays on for serial logging via the composite USB device.
; To re-flash after this: hold BOOT while plugging in to enter download mode
; (otherwise the device enumerates as a USB drive, not a serial port).
build_unflags =
  -DARDUINO_USB_MODE=1
build_flags =
  ${env.build_flags}
  -DBOARD_AMOLED_18=1
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DRSVP_USB_TRANSFER_ENABLED=1
; AXP2101 PMU driver: PWR button (PWRKEY), real power-off, battery telemetry.
lib_deps =
  lewisxhe/XPowersLib @ ^0.2.4

[env:waveshare_esp32s3]
build_flags =
  ${env.build_flags}
  -DRSVP_USB_TRANSFER_ENABLED=0

[env:waveshare_esp32s3_usb_msc]
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_MSC_ON_BOOT=0
  -DRSVP_USB_TRANSFER_ENABLED=1
build_unflags =
  -DARDUINO_USB_MODE=1

[env:native_test]
platform = native
framework =
test_framework = unity
test_filter = test_pacing
test_build_src = yes
build_src_filter = -<*> +<reader/ReadingLoop.cpp>
build_flags =
  -std=c++17
  -Itest/support
  -Isrc
